<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Fireball</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }
            canvas {
                width: min(100vh, 100vw);
                height: min(100vh, 100vw);
            }
        </style>
    </head>
    <body>
        <canvas id="glcanvas" width="800" height="600"></canvas>

        <script>
            const canvas = document.getElementById("glcanvas");
            const gl = canvas.getContext("webgl");

            const vertices = new Float32Array([
                // bottom left
                -1, -1,
                // bottom right
                1, -1,
                // top left
                -1, 1,
                // top right
                1, 1,
            ]);

            const vertexSrc = `
              precision mediump float;
              attribute vec2 a_position;

              varying vec2 v_uv;
              uniform float u_time;

              void main() {
                  v_uv = a_position * 0.5 + 0.5;

                  gl_Position = vec4(a_position, 0.0, 1.0);
              }
            `;

            const fragmentSrc = `
              precision mediump float;

              varying vec2 v_uv;
              uniform float u_time;
              uniform sampler2D u_fireBase;

              float rand(vec2 c){
                  return fract(sin(dot(c, vec2(13.9021, 7.7321))) * 44211.9912);
              }

              float noise(vec2 p){
                  vec2 i = floor(p);
                  vec2 f = fract(p);

                  float a = rand(i);
                  float b = rand(i + vec2(1.0, 0.0));
                  float c = rand(i + vec2(0.0, 1.0));
                  float d = rand(i + vec2(1.0, 1.0));

                  vec2 u = f * f * (3.0 - 2.0 * f);

                  return mix(a, b, u.x) +
                         (c - a) * u.y * (1.0 - u.x) +
                         (d - b) * u.x * u.y;
              }

              float fbm(vec2 p) {
                float value = 0.0;
                float amplitude = 0.5;
                float frequency = 1.0;

                for(int i = 0; i < 4; i++) {
                    value += amplitude * noise(p * frequency);
                    frequency *= 2.0;
                    amplitude *= 0.5;
                }

                return value;
              }

              void main() {
                  const float GRID = 150.0;
                  const float COLORS_NUMBER = 7.0;

                  vec2 cell = floor(v_uv * GRID) / GRID;

                  float flameNoise = fbm(vec2(
                      cell.x * 20.0 + sin(u_time * 2.0),
                      cell.y * 10.0 - u_time * 10.0
                  ));

                  float base = 1.0 - texture2D(u_fireBase, vec2(cell.x, 1.0 - cell.y)).r * 1.5;

                  float flameIntensity = clamp(flameNoise + base, 0.0, 1.0);

                  // Limited number of colors
                  float flameDiscretIntensity = floor(flameIntensity * COLORS_NUMBER) / (COLORS_NUMBER - 1.0);

                  vec3 white = vec3(1.0);
                  vec3 blue   = vec3(0.2, 0.2, 1.0);

                  vec3 color = mix(white, blue, flameDiscretIntensity);

                  float alpha = 1.0 - step(1.0, flameDiscretIntensity);
                  vec4 fireColor = vec4(color, 1.0) * alpha;

                  gl_FragColor = fireColor;
              }

        `;
            function initTexture(image) {
                const texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);

                gl.texImage2D(
                    gl.TEXTURE_2D,
                    0,
                    gl.RGBA,
                    gl.RGBA,
                    gl.UNSIGNED_BYTE,
                    image,
                );

                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_S,
                    gl.CLAMP_TO_EDGE,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_T,
                    gl.CLAMP_TO_EDGE,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_MIN_FILTER,
                    gl.LINEAR,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_MAG_FILTER,
                    gl.LINEAR,
                );

                gl.bindTexture(gl.TEXTURE_2D, null);

                return texture;
            }

            function createShader(type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
                    console.error(gl.getShaderInfoLog(s));
                return s;
            }

            const vs = createShader(gl.VERTEX_SHADER, vertexSrc);
            const fs = createShader(gl.FRAGMENT_SHADER, fragmentSrc);

            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);

            gl.useProgram(program);

            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

            const a_position = gl.getAttribLocation(program, "a_position");
            gl.enableVertexAttribArray(a_position);
            gl.vertexAttribPointer(a_position, 2, gl.FLOAT, false, 0, 0);

            const u_time = gl.getUniformLocation(program, "u_time");
            const u_fireBase = gl.getUniformLocation(program, "u_fireBase");

            const baseImage = new Image();
            baseImage.src = "base.png";
            baseImage.onload = () => {
                const baseTexture = initTexture(baseImage);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, baseTexture);
                gl.uniform1i(u_fireBase, 0);
            };

            function draw(timeMs) {
                gl.uniform1f(u_time, timeMs / 1000);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                requestAnimationFrame(draw);
            }

            requestAnimationFrame(draw);
        </script>
    </body>
</html>
